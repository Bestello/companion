# A signed APK as a GitHub release on every push to main that touches android/, for AppUpdate (Update.kt) to find:
# asset fmc-companion-<versionCode>.apk, versionCode = run number + 1 (1 is the local default), so it only grows.
# Secrets: ANDROID_KEYSTORE_B64 (base64 of the .jks), ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
name: Android release

on:
  push:
    branches: [main]
    paths: [android/**, .github/workflows/android-release.yml]
  workflow_dispatch:

concurrency: android-release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        working-directory: android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<PROPS
          file=$RUNNER_TEMP/release.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS

      - name: Build
        working-directory: android
        run: |
          echo "CODE=$((CODE + 1))" >> "$GITHUB_ENV"
          ./gradlew testDebugUnitTest assembleRelease -PversionCode=$((CODE + 1)) -PversionName=0.1.$((CODE + 1))

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk fmc-companion-$CODE.apk
          gh release create android-0.1.$CODE fmc-companion-$CODE.apk --title "Android 0.1.$CODE" \
            --target ${{ github.sha }} --notes "$(git log -1 --format=%s)"
