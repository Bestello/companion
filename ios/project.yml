# xcodegen generate: makes FMCCompanion.xcodeproj (committed, so xcodebuild works without xcodegen).
name: FMCCompanion
options:
  bundleIdPrefix: tools.fmc
  deploymentTarget:
    iOS: "17.0"
packages:
  WireKit:
    path: WireKit
  # face descriptions on fmc.tools are markdown: headings, lists, quotes, code
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
  # anonymous usage counts, self-hosted (Analytics.swift)
  Aptabase:
    url: https://github.com/aptabase/aptabase-swift
    from: 0.3.12
targets:
  FMCCompanion:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: WireKit
      - package: MarkdownUI
      - package: Aptabase
    # WeatherKit for the miniapp weather service: the capability is also enabled for the App ID in Apple Developer
    entitlements:
      path: App/FMCCompanion.entitlements
      properties:
        com.apple.developer.weatherkit: true
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: FMC Companion
        UILaunchScreen: {}
        UIBackgroundModes: [bluetooth-central]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: FMC Companion connects to your watch to install watch faces and to read which apps are on it.
        NSCalendarsFullAccessUsageDescription: Watch apps you allow show your upcoming events on the watch.
        NSRemindersFullAccessUsageDescription: Watch apps you allow show your reminders on the watch and mark them done.
        NSLocationWhenInUseUsageDescription: Watch apps you allow get the weather and your town, rounded to about 10 km.
        ITSAppUsesNonExemptEncryption: false
        # fmc://install?url=… from the Install button on fmc.tools (FaceLink in Catalog.swift)
        CFBundleURLTypes:
          - CFBundleURLName: tools.fmc.companion
            CFBundleURLSchemes: [fmc]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tools.fmc.companion
        PRODUCT_NAME: FMC Companion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  FMCCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: FMCCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        # the app's PRODUCT_NAME has a space, so xcodegen's default host path misses it
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FMC Companion.app/FMC Companion"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  FMCCompanion:
    build:
      targets:
        FMCCompanion: all
    test:
      targets:
        - FMCCompanionTests
        - package: WireKit/WireKitTests
